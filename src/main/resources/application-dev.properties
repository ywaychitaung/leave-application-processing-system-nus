spring.application.name=laps-nus

# Database Configuration (Development Environment)
spring.datasource.url=jdbc:mysql://localhost:3306/laps_nus
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Server Configuration
server.port=8080

# Logging Configuration (More verbose for development)
logging.level.com.nus=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Security Configuration (Development credentials)
spring.security.user.name=dev
spring.security.user.password=dev123
spring.security.user.roles=ADMIN,USER

# Thymeleaf Configuration (Disable cache for development)
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Development specific settings
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# H2 Console (if you want to use H2 for quick testing)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
