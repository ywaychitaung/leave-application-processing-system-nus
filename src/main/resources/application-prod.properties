# Production Environment Configuration
# Database connection for production
spring.datasource.url=jdbc:mysql://prod-db-host:3306/leave_app_prod?ssl-mode=REQUIRED
spring.datasource.username=${DB_USER:prod_user}
spring.datasource.password=${DB_PASSWORD:prod_password}

# JPA/Hibernate settings for production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging configuration for production
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=INFO

# Production optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true