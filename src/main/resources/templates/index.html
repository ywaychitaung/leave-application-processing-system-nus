<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leave Application Processing System</title>

    <!-- Tailwind CSS -->
    <link
      th:href="@{/css/output.css}"
      href="/css/output.css"
      rel="stylesheet"
    />

    <!-- jQuery -->
    <script th:src="@{/js/jquery.min.js}" src="/js/jquery.min.js"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-6">
      <header class="bg-white shadow-md rounded-lg p-6 mb-6">
        <h1 class="text-3xl font-bold text-gray-800">
          Leave Application Processing System
        </h1>
        <p class="text-gray-600 mt-2">
          Welcome to the NUS Leave Management System
        </p>
      </header>

      <main class="bg-white shadow-md rounded-lg p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
            <h2 class="text-xl font-semibold text-blue-800 mb-2">
              Apply for Leave
            </h2>
            <p class="text-blue-600 mb-4">Submit a new leave application</p>
            <button
              id="apply-btn"
              class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded transition duration-200"
            >
              Apply Now
            </button>
          </div>

          <div class="bg-green-50 border border-green-200 rounded-lg p-4">
            <h2 class="text-xl font-semibold text-green-800 mb-2">
              View Applications
            </h2>
            <p class="text-green-600 mb-4">
              Check your leave application status
            </p>
            <button
              id="view-btn"
              class="bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded transition duration-200"
            >
              View Status
            </button>
          </div>

          <div class="bg-purple-50 border border-purple-200 rounded-lg p-4">
            <h2 class="text-xl font-semibold text-purple-800 mb-2">
              Manage Team
            </h2>
            <p class="text-purple-600 mb-4">
              Approve or reject team applications
            </p>
            <button
              id="manage-btn"
              class="bg-purple-500 hover:bg-purple-600 text-white font-medium py-2 px-4 rounded transition duration-200"
            >
              Manage
            </button>
          </div>
        </div>

        <div class="mt-8">
          <h3 class="text-2xl font-semibold text-gray-800 mb-4">
            Recent Activities
          </h3>
          <div class="bg-gray-50 rounded-lg p-4">
            <div id="activity-list" class="space-y-2">
              <p class="text-gray-600">Loading activities...</p>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Custom JavaScript -->
    <script>
      $(document).ready(function () {
        console.log("jQuery and Tailwind CSS are working!");

        // Sample jQuery functionality
        $("#apply-btn").click(function () {
          alert(
            "Apply for Leave clicked! This would redirect to the application form."
          );
        });

        $("#view-btn").click(function () {
          alert(
            "View Applications clicked! This would show your applications."
          );
        });

        $("#manage-btn").click(function () {
          alert(
            "Manage Team clicked! This would show team management interface."
          );
        });

        // Simulate loading activities
        setTimeout(function () {
          $("#activity-list").html(`
                    <div class="flex items-center justify-between py-2 px-3 bg-white rounded border-l-4 border-blue-400">
                        <span class="text-gray-700">John Doe applied for sick leave</span>
                        <span class="text-sm text-gray-500">2 hours ago</span>
                    </div>
                    <div class="flex items-center justify-between py-2 px-3 bg-white rounded border-l-4 border-green-400">
                        <span class="text-gray-700">Annual leave approved for Jane Smith</span>
                        <span class="text-sm text-gray-500">5 hours ago</span>
                    </div>
                    <div class="flex items-center justify-between py-2 px-3 bg-white rounded border-l-4 border-yellow-400">
                        <span class="text-gray-700">Emergency leave pending review</span>
                        <span class="text-sm text-gray-500">1 day ago</span>
                    </div>
                `);
        }, 1000);
      });
    </script>
  </body>
</html>
